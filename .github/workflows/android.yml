name: Build Android (APK)

on:
  workflow_dispatch:      # botão "Run workflow" na aba Actions
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (exigido pelo RAPT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache do Ren'Py SDK + RAPT + Android SDK
        id: cache-renpy
        uses: actions/cache@v4
        with:
          path: renpy-sdk
          key: renpy-sdk-rapt-8.5.3-v2

      - name: Baixar Ren'Py SDK e RAPT
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o renpy.tar.bz2 https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
          mkdir renpy-sdk
          tar -xjf renpy.tar.bz2 -C renpy-sdk --strip-components=1
          curl -sSL -o rapt.zip https://www.renpy.org/dl/8.5.3/renpy-8.5.3-rapt.zip
          unzip -q rapt.zip -d renpy-sdk

      - name: Restaurar chaves de assinatura (secrets)
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android.keystore
          echo "$BUNDLE_KEYSTORE_B64" | base64 -d > bundle.keystore
          printf '%s' "$ANDROID_JSON" > android.json
          cp android.json .android.json
          cp android.keystore bundle.keystore renpy-sdk/rapt/
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          BUNDLE_KEYSTORE_B64: ${{ secrets.BUNDLE_KEYSTORE_B64 }}
          ANDROID_JSON: ${{ secrets.ANDROID_JSON }}

      - name: Instalar Android SDK (RAPT)
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        env:
          RAPT_NO_TERMS: "1"
        run: |
          cd renpy-sdk/rapt
          yes y | ../lib/py3-linux-x86_64/python -O -c "import sys, os; sys.path.insert(0, os.path.dirname(os.getcwd())); sys.argv = ['android.py', 'installsdk']; exec(open('android.py').read())" || true
          test -d Sdk || (echo "Android SDK não instalado" && exit 1)

      - name: Escrever local.properties (assinatura)
        env:
          ANDROID_SDK_DIR: ${{ github.workspace }}/renpy-sdk/rapt/Sdk
          KEYSTORE_PATH: ${{ github.workspace }}/renpy-sdk/rapt/android.keystore
        run: |
          mkdir -p renpy-sdk/rapt/project
          cat > renpy-sdk/rapt/project/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_DIR
          key.store=$KEYSTORE_PATH
          key.store.password=android
          key.alias=android
          key.alias.password=android
          EOF
          cat renpy-sdk/rapt/project/local.properties

      - name: Limitar APK a arm64-v8a (celulares modernos)
        run: |
          GRADLE=renpy-sdk/rapt/templates/app-build.gradle
          sed -i '/versionName/i\        ndk { abiFilters "arm64-v8a" }' "$GRADLE"
          grep -n 'abiFilters\|versionName\|ndk' "$GRADLE"

      - name: Gerar APK
        run: |
          cd renpy-sdk
          ./renpy.sh launcher android_build "$GITHUB_WORKSPACE" --dest "$GITHUB_WORKSPACE/dist"
          ls -la "$GITHUB_WORKSPACE/dist"

      # RAPT empacota a si mesmo (rapt/prototype + bundletool.jar, o build
      # tool do Android) como assets/x-rapt.zip dentro do próprio APK do jogo —
      # ~68 MB (26%) que não tem nenhuma função em tempo de execução, já que
      # este projeto não usa o updater do Ren'Py. build.classify não alcança
      # esse arquivo (RAPT o gera direto, fora do sweep de distribute), então
      # a única forma de tirar é remover do zip já assinado e reassinar.
      - name: Remover assets/x-rapt.zip e reassinar o APK
        env:
          ANDROID_SDK_DIR: ${{ github.workspace }}/renpy-sdk/rapt/Sdk
          KEYSTORE_PATH: ${{ github.workspace }}/renpy-sdk/rapt/android.keystore
        run: |
          APK=$(ls dist/*.apk | head -1)
          echo "Antes:"; du -h "$APK"
          zip -q -d "$APK" "assets/x-rapt.zip"
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_DIR"/build-tools/*/ | sort -V | tail -1)
          APKSIGNER="${BUILD_TOOLS}apksigner"
          "$APKSIGNER" sign --ks "$KEYSTORE_PATH" --ks-key-alias android \
            --ks-pass pass:android --key-pass pass:android "$APK"
          "$APKSIGNER" verify "$APK"
          echo "Depois:"; du -h "$APK"

      - name: Remover chaves antes do cache ser salvo
        if: always()
        run: |
          rm -f renpy-sdk/rapt/android.keystore renpy-sdk/rapt/bundle.keystore \
                android.keystore bundle.keystore android.json .android.json \
                renpy-sdk/rapt/project/local.properties

      # A release é o entregável oficial: assets de release não consomem a cota
      # de artefatos do Actions (500 MB no plano Free), e o APK sozinho passa de
      # 900 MB. Por isso ela vem ANTES do upload-artifact.
      - name: Anexar à release (apenas em tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

      # Conveniência para execuções manuais (sem tag), onde não há release.
      # Tolerante a falha: se a cota de artefatos estourar, o build não quebra.
      - name: Publicar APK como artefato
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: apk-caminhos-do-cuidado
          path: dist/*.apk
          retention-days: 5
