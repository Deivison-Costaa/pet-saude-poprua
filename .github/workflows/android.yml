name: Build Android (APK)

on:
  workflow_dispatch:      # botão "Run workflow" na aba Actions
  push:
    tags: ["v*"]
    branches: [infra-github]   # gatilho temporário para validar o workflow

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (exigido pelo RAPT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache do Ren'Py SDK + RAPT + Android SDK
        id: cache-renpy
        uses: actions/cache@v4
        with:
          path: renpy-sdk
          key: renpy-sdk-rapt-8.5.3-v1

      - name: Baixar Ren'Py SDK e RAPT
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o renpy.tar.bz2 https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
          mkdir renpy-sdk
          tar -xjf renpy.tar.bz2 -C renpy-sdk --strip-components=1
          curl -sSL -o rapt.zip https://www.renpy.org/dl/8.5.3/renpy-8.5.3-rapt.zip
          unzip -q rapt.zip -d renpy-sdk

      - name: Restaurar chaves de assinatura (secrets)
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android.keystore
          echo "$BUNDLE_KEYSTORE_B64" | base64 -d > bundle.keystore
          printf '%s' "$ANDROID_JSON" > android.json
          cp android.keystore bundle.keystore renpy-sdk/rapt/
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          BUNDLE_KEYSTORE_B64: ${{ secrets.BUNDLE_KEYSTORE_B64 }}
          ANDROID_JSON: ${{ secrets.ANDROID_JSON }}

      - name: Instalar Android SDK (RAPT)
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        run: |
          cd renpy-sdk/rapt
          yes y | ../lib/py3-linux-x86_64/python -O android.py installsdk || true
          test -d Sdk || (echo "Android SDK não instalado" && exit 1)

      - name: Gerar APK
        run: |
          ./renpy-sdk/renpy.sh renpy-sdk/launcher android_build "$GITHUB_WORKSPACE" --dest dist
          ls -la dist

      - name: Remover chaves antes do cache ser salvo
        if: always()
        run: rm -f renpy-sdk/rapt/android.keystore renpy-sdk/rapt/bundle.keystore android.keystore bundle.keystore android.json

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: apk-caminhos-do-cuidado
          path: dist/*.apk
          retention-days: 30

      - name: Anexar à release (apenas em tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
