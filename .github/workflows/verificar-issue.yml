name: Verificar issue vinculada

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

jobs:
  verificar-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Avisar se falta "Closes #N" ou label sem-issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            if (pr.labels.some(l => l.name === 'sem-issue')) {
              core.info('Label "sem-issue" aplicada — nada a avisar.');
              return;
            }

            const body = pr.body || '';
            const referenciaIssue = /\b(clos(?:e|es|ed)|fix(?:es|ed)?|resolv(?:e|es|ed))\s+#\d+/i;
            if (referenciaIssue.test(body)) {
              core.info('Referência de issue encontrada na descrição.');
              return;
            }

            core.warning(
              'Este PR não vincula nenhuma issue. O ideal é colocar "Closes #N" ' +
              '(ou Fixes/Resolves) na descrição, mas isso não bloqueia o merge.'
            );
